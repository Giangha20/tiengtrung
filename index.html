<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung HSK 1-4 & Giao Tiếp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h5> Bản Demo (creator: Hà Hữu Giang)</h5>
            <h1>Hệ thống Ôn tập HSK 1-4 </h1>
            <div class="controls">
                <select id="hsk-level" onchange="changeLevel()">
                    <option value="1">HSK 1</option>
                    <option value="2">HSK 2</option>
                    <option value="3">HSK 3</option>
                    <option value="4">HSK 4</option>
                </select>
                <button onclick="switchMode('list')">📚 Danh sách từ</button>
                <button onclick="switchMode('typing')">⌨️ Bài tập gõ</button>
                <button onclick="switchMode('exam')">📝 Thi thử HSK</button>
            </div>
        </header>

        <main>
            <!-- Chế độ 1: Danh sách từ vựng -->
            <section id="list-mode" class="active">
                <h2>Danh sách từ vựng (<span id="total-words">0</span> từ) - <i></i></h2>
            

                <div class="word-grid" id="word-list"></div>
            </section>

            <!-- Chế độ 2: Bài tập gõ -->

<section id="typing-mode">
    <h2>Bài tập gõ Pinyin / Chữ Hán</h2>
    <div class="typing-container">
        <div class="flashcard">
            <!-- Đã thêm container chứa chữ Hán và Nút phát âm -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <div class="word-display" id="typing-word">我</div>
                <button type="button" onclick="speakCurrentTypingWord()" title="Phát âm" style="background: none; border: none; font-size: 1.8rem; cursor: pointer;">🔊</button>
            </div>
            <div class="meaning-display" id="typing-meaning">tôi, tớ, mình</div>
        </div>
        <div class="input-area">
            <label for="typing-input">Gõ Pinyin (hoặc chữ Hán) của từ trên:</label>
            <input type="text" id="typing-input" placeholder="Nhập pinyin ví dụ: wo..." autocomplete="off">
            
            <div class="action-buttons" style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="checkTyping()">Kiểm tra</button>
                <button onclick="skipTypingWord()" class="btn-skip" style="background-color: #6c757d; color: white;">Bỏ qua ⏭️</button>
            </div>
        </div>
        <p id="typing-feedback"></p>
        <button id="next-word-btn" class="hidden" onclick="nextTypingWord()">Từ tiếp theo ➡️</button>
    </div>
</section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
