name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web assets and sync Android
        run: |
          node build_www.js
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/TiengTrung-HSK.apk
          ls -lh build-output/TiengTrung-HSK.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiengTrung-HSK-Android-apk
          path: build-output/TiengTrung-HSK.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name }}
          name: "Học Tiếng Trung HSK 2.0 (${{ github.ref_name }})"
          body: "Bản phát hành ứng dụng Học Tiếng Trung HSK. Bao gồm file cài đặt APK cho Android và IPA cho iOS."
          files: build-output/TiengTrung-HSK.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
