<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Học Tiếng Trung Giang Hà</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --primary-deep: #b91c1c;
            --bg-gradient: radial-gradient(circle at 15% 15%, rgba(239, 68, 68, .18) 0, transparent 40%),
                           radial-gradient(circle at 85% 85%, rgba(59, 130, 246, .18) 0, transparent 40%),
                           radial-gradient(circle at 50% 50%, rgba(16, 185, 129, .1) 0, transparent 60%),
                           #f8fafc;
            --card-bg: rgba(255, 255, 255, .94);
            --card-border: rgba(255, 255, 255, .8);
            --card-shadow: 0 25px 60px -15px rgba(15, 23, 42, .15), 0 0 0 1px rgba(226, 232, 240, .8);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --input-focus-ring: rgba(239, 68, 68, .18);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: radial-gradient(circle at 15% 15%, rgba(239, 68, 68, .25) 0, transparent 45%),
                               radial-gradient(circle at 85% 85%, rgba(59, 130, 246, .22) 0, transparent 45%),
                               radial-gradient(circle at 50% 50%, rgba(16, 185, 129, .12) 0, transparent 60%),
                               #0b0f17;
                --card-bg: rgba(18, 24, 38, .86);
                --card-border: rgba(255, 255, 255, .08);
                --card-shadow: 0 30px 70px -15px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .08);
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --input-bg: rgba(15, 23, 42, .65);
                --input-border: #334155;
                --input-focus-ring: rgba(239, 68, 68, .28);
            }
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 18px;
            background: var(--bg-gradient);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Spheres */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: .65;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .bg-orb-1 {
            width: 340px; height: 340px;
            background: radial-gradient(circle, #ef4444, #f43f5e);
            top: -80px; left: -80px;
        }
        .bg-orb-2 {
            width: 320px; height: 320px;
            background: radial-gradient(circle, #3b82f6, #6366f1);
            bottom: -80px; right: -80px;
            animation-delay: -7s;
        }
        .bg-orb-3 {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #10b981, #14b8a6);
            bottom: 30%; left: 50%;
            transform: translateX(-50%);
            animation-delay: -3.5s;
            opacity: .35;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Card */
        .login-box {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 36px 32px;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 1;
            animation: cardEntrance .5s cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(24px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 800;
            letter-spacing: .6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, rgba(239, 68, 68, .12), rgba(244, 63, 94, .12));
            color: var(--primary);
            border: 1px solid rgba(239, 68, 68, .25);
            margin-bottom: 14px;
        }
        .brand-pill .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(.75); }
        }

        .avatar-wrapper {
            position: relative;
            width: 96px; height: 96px;
            margin: 0 auto 16px;
        }
        .avatar-ring {
            position: absolute; inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #f59e0b, #10b981, #3b82f6);
            background-size: 200% 200%;
            animation: rotateRing 8s linear infinite;
            box-shadow: 0 8px 24px rgba(239, 68, 68, .3);
        }
        @keyframes rotateRing {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .avatar-img {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            background: #fff;
            z-index: 1;
        }
        .avatar-default {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background: linear-gradient(135deg, #ef4444, #f43f5e);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px; font-weight: 800;
            z-index: 1;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -.4px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 7px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            width: 20px; height: 20px;
            pointer-events: none;
            transition: color .2s;
            display: flex; align-items: center; justify-content: center;
        }
        .input {
            width: 100%;
            height: 52px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 16px;
            padding: 0 16px 0 46px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
            transition: all .2s ease;
        }
        .password-box .input {
            padding-right: 50px;
        }
        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--input-focus-ring);
        }
        .input:focus ~ .input-icon {
            color: var(--primary);
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            color: #94a3b8;
            transition: color .2s;
        }
        .show-password:hover {
            color: var(--primary);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
        }
        .remember input {
            width: 17px; height: 17px;
            accent-color: var(--primary);
            border-radius: 4px;
            cursor: pointer;
        }

        /* 3D Button */
        .login-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, #ef4444 0%, #f43f5e 100%);
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            position: relative;
            box-shadow: 0 4px 0 var(--primary-deep), 0 12px 24px rgba(239, 68, 68, .35);
            transition: all .15s ease;
            user-select: none;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--primary-deep), 0 16px 28px rgba(239, 68, 68, .4);
        }
        .login-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--primary-deep), 0 4px 10px rgba(239, 68, 68, .3);
        }
        .login-btn:disabled {
            opacity: .65;
            cursor: wait;
            transform: none !important;
            box-shadow: none !important;
        }

        .forgot-wrap {
            text-align: center;
            margin-top: 14px;
        }
        .forgot-wrap a {
            color: var(--primary);
            font-weight: 700;
            font-size: 13.5px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .forgot-wrap a:hover {
            text-decoration: underline;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--input-border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
        }
        .register-text a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
            margin-left: 5px;
        }
        .register-text a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
        }
        .message.show { display: block; }
        .ui-icon {
            width: 19px; height: 19px;
            stroke-width: 2.2;
            vertical-align: -.2em;
            flex-shrink: 0;
        }
    </style>

<svg id="inline-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<defs>
<symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6Z" fill="none" stroke="currentColor"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor"/></symbol>
<symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2C11.05 6.07 11.52 6 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.6M6.2 6.9C3.8 8.6 2.5 12 2.5 12S6 18 12 18c1.2 0 2.3-.2 3.3-.6" fill="none" stroke="currentColor"/></symbol>
<symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor"/></symbol>
<symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor"/></symbol>
<symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 6.5L20 12l-6.5 1.5L12 20l-1.5-6.5L4 12l6.5-2.5L12 3Z" fill="currentColor"/></symbol>
</defs></svg>
</head>

<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="login-box">

        <!-- LOGO BRAND HEADER -->
        <div class="brand-header">
            <div class="brand-pill">
                <span class="dot"></span>
                <span>Học Tiếng Trung Giang Hà</span>
            </div>

            <div class="avatar-wrapper">
                <div class="avatar-ring"></div>
                <img
                    src="avatar192.jpg"
                    alt="Tiếng Trung"
                    id="logoImage"
                    class="avatar-img"
                    onerror="this.style.display='none'; document.getElementById('logoDefault').style.display='flex';"
                >
                <div
                    class="avatar-default"
                    id="logoDefault"
                    style="display:none;"
                >
                    中
                </div>
            </div>

            <h1 class="title">Đăng nhập tài khoản</h1>
            <p class="subtitle">Hệ thống luyện thi & học từ vựng HSK thông minh</p>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="loginForm">

            <div class="form-group">
                <label for="username">Email đăng ký</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="username"
                        class="input"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >
                    <span class="input-icon">
                        <svg class="ui-icon" aria-hidden="true"><use href="#icon-mail"></use></svg>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrap password-box">
                    <input
                        type="password"
                        id="password"
                        class="input"
                        placeholder="Nhập mật khẩu của bạn"
                        autocomplete="current-password"
                        required
                    >
                    <span class="input-icon">
                        <svg class="ui-icon" aria-hidden="true"><use href="#icon-lock"></use></svg>
                    </span>
                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Hiện mật khẩu"
                        title="Hiện mật khẩu"
                    >
                        <svg class="ui-icon" aria-hidden="true"><use href="#icon-eye-off"></use></svg>
                    </button>
                </div>
            </div>

            <label class="remember">
                <input
                    type="checkbox"
                    id="remember"
                    checked
                >
                <span>Ghi nhớ đăng nhập trên thiết bị này</span>
            </label>

            <button
                type="submit"
                class="login-btn"
            >
                <svg class="ui-icon" aria-hidden="true"><use href="#icon-spark"></use></svg>
                <span>Đăng nhập ngay</span>
            </button>

        </form>

        <div class="forgot-wrap">
            <a href="forgot-password.html">
                <svg class="ui-icon" style="width:16px;height:16px" aria-hidden="true"><use href="#icon-lock"></use></svg>
                <span>Quên mật khẩu? Đặt lại mật khẩu</span>
            </a>
        </div>

        <!-- THÔNG BÁO -->
        <div id="message" class="message"></div>

        <!-- ĐĂNG KÝ -->
        <div class="register-text">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký tài khoản mới</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            Bảo vệ bởi Google Firebase Authentication • Giang Hà © 2026
        </div>

    </div>

<script>
(function () {
    const firebaseScripts = [
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"
    ];

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error("Không tải được Firebase SDK: " + src));
            document.head.appendChild(s);
        });
    }

    async function boot() {
        const showPasswordButton = document.getElementById("showPassword");
        const passwordInput = document.getElementById("password");
        if (showPasswordButton && passwordInput) {
            showPasswordButton.addEventListener("click", function () {
                const hidden = passwordInput.type === "password";
                passwordInput.type = hidden ? "text" : "password";
                showPasswordButton.innerHTML = hidden ? '<svg class="ui-icon" aria-hidden="true"><use href="#icon-eye"></use></svg>' : '<svg class="ui-icon" aria-hidden="true"><use href="#icon-eye-off"></use></svg>';
                showPasswordButton.setAttribute("aria-label", hidden ? "Ẩn mật khẩu" : "Hiện mật khẩu");
            });
        }

        try {
            for (const src of firebaseScripts) await loadScript(src);
            await loadScript("./firebase-config.js");
            await loadScript("./auth.js");

            if (!window.ghFirebaseConfigured || !window.ghAuth) {
                throw new Error("Firebase chưa được khởi tạo. Kiểm tra firebase-config.js và Authorized domains.");
            }

            const loginForm = document.getElementById("loginForm");
            loginForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                const email = document.getElementById("username").value.trim().toLowerCase();
                const password = document.getElementById("password").value;
                const btn = this.querySelector('button[type="submit"]');

                if (!email || !email.includes("@")) {
                    alert("Vui lòng nhập Email đã đăng ký.");
                    return;
                }

                if (btn) { btn.disabled = true; btn.dataset.oldText = btn.innerHTML; btn.innerHTML = "<span>Đang đăng nhập...</span>"; }
                try {
                    await window.ghAuth.login(email, password);
                    window.location.replace("./index.html");
                } catch (error) {
                    console.error("Firebase login error:", error);
                    const messages = {
                        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
                        "auth/user-not-found": "Không tìm thấy tài khoản.",
                        "auth/wrong-password": "Mật khẩu không đúng.",
                        "auth/too-many-requests": "Có quá nhiều lần thử. Vui lòng thử lại sau.",
                        "auth/network-request-failed": "Không có kết nối mạng hoặc Firebase bị chặn.",
                        "auth/operation-not-allowed": "Firebase chưa bật đăng nhập Email/Password."
                    };
                    alert(messages[error.code] || ("Đăng nhập thất bại: " + (error.message || error)));
                    if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.oldText || "<span>Đăng nhập ngay</span>"; }
                }
            });

            window.ghAuthReady.then(function (readyUser) {
                if (readyUser) window.location.replace("./index.html");
            }).catch(function () {});
        } catch (error) {
            console.error("Firebase bootstrap error:", error);
            alert("Không thể khởi tạo Firebase. Kiểm tra firebase-config.js, Firebase SDK và Authorized domains.");
        }
    }

    boot();
})();
</script>
</body>
</html>
